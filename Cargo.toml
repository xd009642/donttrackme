[package]
name = "donttrackme"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
cpal = "0.18.1"
hound = "3.5.1"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
